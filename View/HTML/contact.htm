<!DOCTYPE html>
<html lang="en">
<head>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

  <link rel="stylesheet" href="../CSS/contact.css">
</head>
<body>

 <div id="header"></div>

  <!-- Hero Section -->
  <header class="contact-hero">
    <div class="container text-center">
      <h1>Contact Us</h1>
      <p class="lead text-light">We would love to hear from you! Get in touch with us today.</p>
    </div>
  </header>

  <!-- Contact Info + Form -->
  <section class="contact-section py-5">
    <div class="container">
      <div class="row g-4">
        
        <!-- Contact Info -->
        <div class="col-lg-4">
          <div class="card shadow-sm p-4 h-100">
            <h4 class="mb-3">Get in Touch</h4>
            <p><strong>Address:</strong><br> 123 NGO Street, Lucknow, India</p>
            <p><strong>Email:</strong><br> info@friendsofeducation.org</p>
            <p><strong>Phone:</strong><br> +91 98765 43210</p>
            <div class="mt-3">
              <a href="#" class="me-3 text-orange"><i class="bi bi-facebook"></i></a>
              <a href="#" class="me-3 text-orange"><i class="bi bi-twitter"></i></a>
              <a href="#" class="text-orange"><i class="bi bi-instagram"></i></a>
            </div>
          </div>
        </div>

        <!-- Contact Form -->
        <div class="col-lg-8">
          <div class="card shadow-sm p-4">
            <h4 class="mb-3">Send us a Message</h4>
            <form action="send_message.php" method="POST">
              <div class="row">
                <div class="col-md-6 mb-3">
                  <input type="text" name="name" class="form-control" placeholder="Your Name" required>
                </div>
                <div class="col-md-6 mb-3">
                  <input type="email" name="email" class="form-control" placeholder="Your Email" required>
                </div>
              </div>
              <div class="mb-3">
                <input type="text" name="subject" class="form-control" placeholder="Subject">
              </div>
              <div class="mb-3">
                <textarea name="message" class="form-control" rows="5" placeholder="Your Message" required></textarea>
              </div>
              <button type="submit" class="btn btn-donate">Send Message</button>
            </form>
          </div>
        </div>
      </div>
    </div>
  </section>

  <!-- Map -->
  <section class="map-section">
    <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3559.84701951868!2d80.9462!3d26.8467!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x3999561d4f2f!2sLucknow!5e0!3m2!1sen!2sin!4v1689415968407"
      width="100%" height="350" style="border:0;" allowfullscreen="" loading="lazy"></iframe>
