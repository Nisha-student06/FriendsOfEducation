<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Friends of Education</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../CSS/login.css">
</head>
<body>

  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-light bg-white shadow fixed-top">
    <div class="container">
      <a class="navbar-brand fw-bold text-orange" href="index.html">Friends of Education</a>
    </div>
  </nav>

  <!-- Login Section -->
  <section class="login-section d-flex justify-content-center align-items-center">
    <div class="login-box shadow-lg p-5 bg-white rounded">
      <h2 class="text-center mb-4">Login</h2>

      <form>
        <!-- Role Selection -->
        <div class="mb-3">
          <label for="role" class="form-label">Login as</label>
          <select class="form-select" id="role" required>
            <option value="">Select Role</option>
            <option value="admin">Admin / Staff</option>
            <option value="volunteer">Volunteer</option>
            <option value="donor">Donor</option>
          </select>
        </div>

        <!-- Email / Username -->
        <div class="mb-3">
          <label for="email" class="form-label">Email / Username</label>
          <input type="email" class="form-control" id="email" placeholder="Enter your email" required>
        </div>

        <!-- Password -->
        <div class="mb-3">
          <label for="password" class="form-label">Password</label>
          <input type="password" class="form-control" id="password" placeholder="Enter your password" required>
        </div>

        <!-- Remember Me -->
        <div class="mb-3 form-check">
          <input type="checkbox" class="form-check-input" id="remember">
          <label class="form-check-label" for="remember">Remember me</label>
        </div>

        <!-- Submit -->
        <button type="submit" class="btn btn-primary w-100">Login</button>

        <!-- Extra Links -->
        <div class="mt-3 text-center">
          <a href="#">Forgot Password?</a> | <a href="register.html">Create Account</a>
        </div>
      </form>
    </div>
  </section>


  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
